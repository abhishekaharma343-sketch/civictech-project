<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Issue Detail - Civic Pulse</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .status-pending { background: #F94144; color: white; }
        .status-progress { background: #F9C74F; color: #1a1a1a; }
        .status-resolved { background: #2d6a4f; color: white; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#191c1d] antialiased font-body-lg">

<!-- Header -->
<header class="bg-white sticky top-0 z-50 flex items-center px-5 py-4 w-full shadow-sm">
    <a href="index.html" class="mr-4 p-2 rounded-full hover:bg-gray-100">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="text-xl font-bold text-[#0f5238] flex-1">Issue Detail</h1>
    <button class="p-2 rounded-full hover:bg-gray-100">
        <span class="material-symbols-outlined">share</span>
    </button>
</header>

<!-- Main -->
<main class="px-5 py-4 flex flex-col gap-5 pb-32">

    <!-- Image -->
    <div class="rounded-2xl overflow-hidden h-56 bg-gray-200 relative">
        <img src="https://picsum.photos/seed/pothole/800/400" alt="Issue photo" class="w-full h-full object-cover">
        <span class="absolute top-4 left-4 bg-[#2d6a4f] text-white text-sm px-3 py-1 rounded-full">🕳️ Pothole</span>
    </div>

    <!-- Title & Status -->
    <div>
        <h2 class="text-2xl font-bold">Deep pothole on MG Road</h2>
        <div class="flex items-center gap-2 mt-2">
            <span class="status-pending text-sm px-3 py-1 rounded-full">⏳ Pending</span>
            <span class="text-sm text-gray-500">📍 250m away</span>
        </div>
        <p class="text-gray-600 mt-3">Large pothole in the right lane, approx 2ft wide and 6 inches deep. Dangerous for two-wheelers.</p>
    </div>

    <!-- Timeline -->
    <div>
        <h3 class="font-semibold mb-3">📋 Status Timeline</h3>
        <div class="space-y-3">
            <div class="flex items-start gap-3">
                <span class="material-symbols-outlined text-[#2d6a4f]">check_circle
